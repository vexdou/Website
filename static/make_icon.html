<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEXDOU Icon Generator</title>
</head>
<body style="background:#111; color:#fff; text-align:center; padding-top:50px; font-family:sans-serif;">
  <h2>Soo saarista Icon-ka VEXDOU...</h2>
  <canvas id="iconCanvas" width="512" height="512" style="display:none;"></canvas>
  <br>
  <a id="downloadLink" download="icon.png" style="background:#10b981; color:#fff; padding:12px 24px; text-decoration:none; border-radius:8px; font-weight:bold; display:inline-block; margin-top:20px;">Degso icon.png Hadda</a>

  <script>
    const canvas = document.getElementById('iconCanvas');
    const ctx = canvas.getContext('2d');

    // 1. Asalka madow ee cidhifyada wareegsan (Rounded Background)
    ctx.fillStyle = '#07070b';
    ctx.beginPath();
    // Ku sawir xagal wareegsan oo u ekaysiinaya App Icon casri ah
    if (ctx.roundRect) {
      ctx.roundRect(0, 0, 512, 512, 112);
    } else {
      ctx.rect(0, 0, 512, 512);
    }
    ctx.fill();

    // 2. Ku darista xarafka "V" oo wata midab dhaldhalaala (Gradient)
    let grad = ctx.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, '#10b981'); // Cagaar dhalaalaya
    grad.addColorStop(1, '#059669'); // Cagaar madow yar

    ctx.fillStyle = grad;
    ctx.font = 'bold 280px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('V', 256, 265);

    // 3. Si otomaatig ah uga dhig mid la soo dejisan karo
    const dataURL = canvas.toDataURL('image/png');
    const link = document.getElementById('downloadLink');
    link.href = dataURL;
  </script>
</body>
</html>
