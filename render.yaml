services:
  - type: web
    name: quickdl-web
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WORKER_POLL_SECONDS
        value: "0.7"
      - key: MAX_FILE_MB
        value: "300"
      - key: KEEP_FILE_HOURS
        value: "6"
