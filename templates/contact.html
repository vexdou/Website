<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>QuickDL — Contact</title><style>:root{color-scheme:dark}body{margin:0;background:radial-gradient(700px 300px at 50% -80px,#252a62,transparent 70%),#080a10;color:#f6f8fc;font-family:Inter,system-ui;padding:30px}.wrap{max-width:650px;margin:auto}.back{display:inline-block;margin-bottom:18px;color:#b6beff;text-decoration:none;font-weight:800}.card{background:#111620;border:1px solid #252b38;border-radius:24px;padding:24px;box-shadow:0 25px 80px #0005}h1{margin:0 0 7px}p{color:#9ea7b7}label{display:block;font-size:12px;font-weight:800;color:#c5ccda;margin:15px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #2a3040;background:#0b0e15;color:#fff;outline:0}textarea{min-height:170px;resize:vertical}button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#6f7cff,#925dff);color:#fff;font-weight:900;cursor:pointer}#msg{margin-top:12px;font-size:12px}</style></head><body><div class="wrap"><a class="back" href="/">← Back to QuickDL</a><div class="card"><h1>Contact QuickDL</h1><p>Report download problems, payment issues, account problems or suggestions.</p><form id="f"><label>Name (optional)</label><input id="name" maxlength="160"><label>Email (optional)</label><input id="email" type="email" maxlength="320"><label>Message</label><textarea id="message" maxlength="5000" required></textarea><button>Send message</button></form><div id="msg"></div></div></div><script>const f=document.getElementById('f'),msg=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();msg.textContent='Sending…';try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name:name.value,email:email.value,message:message.value})});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.message||'Could not send message'));msg.textContent=d.message||'Message sent.';f.reset()}catch(x){msg.textContent=x.message}}</script></body></html>
