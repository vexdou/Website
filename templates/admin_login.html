<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0a12"><title>QuickDL Admin</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08080c;color:#fff;font-family:system-ui}.box{width:min(420px,calc(100% - 30px));padding:30px;border:1px solid #272733;border-radius:24px;background:#111219;box-shadow:0 30px 80px #0008}.brand{font-size:25px;font-weight:950}.brand span{color:#a18cff}p{color:#9295a4}input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #292a35;background:#0a0b10;color:#fff;outline:0;margin:12px 0}button{width:100%;padding:13px;border:0;border-radius:12px;background:#7c5cff;color:#fff;font-weight:900;cursor:pointer}#msg{color:#ff7b88;font-size:13px;margin-top:12px}</style></head><body><div class="box"><div class="brand">Quick<span>DL</span> Admin</div><p>Sign in to the control center.</p><form id="f"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button>Sign in</button></form><div id="msg"></div></div><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Login failed');location.href='/admin18'}catch(x){msg.textContent=x.message}}</script></body></html>
