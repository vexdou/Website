<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — QuickDL</title><style>body{font-family:system-ui;background:#0b1016;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(420px,calc(100% - 32px));background:#111923;border:1px solid #263544;border-radius:16px;padding:22px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin-top:10px;font:inherit}input{background:#0b1118;color:#fff;border:1px solid #334252}button{border:0;background:#2ea6ff;color:#fff;font-weight:700}.muted{color:#93a0ad}</style></head><body><div class="card"><h2>QuickDL Admin</h2><p class="muted">Sign in to open the Telegram admin panel.</p><input id="p" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="m" class="muted"></p></div><script>async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('p').value})});const j=await r.json().catch(()=>({}));if(!r.ok){document.getElementById('m').textContent=j.detail||'Login failed';return}location.href='/telegram/admin'}</script></body></html>
