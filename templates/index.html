<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickDL — Download Fast</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { font-size: 1.5rem; font-weight: bold; color: var(--primary); text-decoration: none; }

        .hero {
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 { font-size: 3rem; margin-bottom: 10px; }

        .download-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 600px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        input { flex: 1; background: #334155; color: white; }

        button {
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); }

        .platforms {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<header>
    <a class="brand" href="/">QuickDL</a>
    <div class="head-right">
        <button id="creditsBtn">100 Credits</button>
    </div>
</header>

<main>
    <section class="hero">
        <h1>Download media. <br><span style="color: var(--primary);">Without the hassle.</span></h1>
        <p>Paste a public media URL and get your video or MP3 in seconds.</p>
    </section>

    <section class="download-card">
        <div class="input-row">
            <input id="url" type="url" placeholder="Paste video link here...">
            <select id="kind">
                <option value="video">MP4</option>
                <option value="audio">MP3</option>
            </select>
            <button id="downloadBtn">Download</button>
        </div>
        <p style="margin-top: 15px; font-size: 0.9rem; color: #94a3b8;">Each download costs 2 credits.</p>
    </section>

    <div class="platforms">
        <span>YouTube</span> · <span>TikTok</span> · <span>Instagram</span> · <span>Twitter</span>
    </div>
</main>

</body>
</html>
