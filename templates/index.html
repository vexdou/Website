<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030605"><meta name="description" content="VEXDOU fast media downloader">
<link rel="manifest" href="/manifest.json"><title>VEXDOU — Downloader</title>
<style>
:root{--bg:#030605;--panel:#09120f;--line:rgba(255,255,255,.09);--muted:#71817c;--text:#f3fff9;--accent:#00e99e;--accent2:#59d5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(0,233,158,.13),transparent 30%),radial-gradient(circle at 90% 10%,rgba(89,213,255,.12),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.wrap{width:min(1120px,calc(100% - 24px));margin:auto}header{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:rgba(3,6,5,.78);backdrop-filter:blur(18px)}.brand{font-weight:950;letter-spacing:.5px;display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00140c;font-weight:1000;font-size:20px}.sub{font-size:8px;color:#71817c;display:block;letter-spacing:2px}.nav{display:flex;gap:7px}.nav button,.chip,.action{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:12px;padding:9px 12px}.nav button.active{color:var(--accent);border-color:rgba(0,233,158,.25);background:rgba(0,233,158,.06)}.hero{text-align:center;padding:65px 0 35px}.badge{display:inline-block;border:1px solid rgba(0,233,158,.2);background:rgba(0,233,158,.05);padding:8px 12px;border-radius:999px;color:#8ce4c5;font-size:10px;font-weight:900;letter-spacing:1.5px}h1{font-size:clamp(48px,9vw,88px);line-height:.9;letter-spacing:-5px;margin:22px 0 18px}h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));background-clip:text;-webkit-background-clip:text;color:transparent}.lead{color:var(--muted);max-width:650px;margin:auto;line-height:1.7}.box{margin:18px auto 45px;padding:18px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(135deg,rgba(15,30,25,.85),rgba(5,12,13,.85));box-shadow:0 25px 80px rgba(0,0,0,.4)}.row{display:grid;grid-template-columns:1fr 145px 145px;gap:9px}.input,.select,.primary{height:54px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:14px;padding:0 15px;outline:none;color:var(--text)}.primary{border:0;background:linear-gradient(135deg,var(--accent),#00b978);color:#00140c;font-weight:950}.input:focus,.select:focus{border-color:rgba(0,233,158,.5)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chip{font-size:11px;color:#9baaa5}.status{display:none;margin-top:12px;padding:13px;border-radius:14px;background:rgba(0,233,158,.05);border:1px solid rgba(0,233,158,.14)}.status.show{display:block}.progress{height:5px;background:rgba(255,255,255,.08);border-radius:9px;margin-top:10px;overflow:hidden}.bar{height:100%;width:8%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s}.section{padding:10px 0 55px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.head h2{margin:0;font-size:28px}.muted{color:var(--muted);font-size:11px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.025)}.thumb{height:175px;background:#07100d;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.title{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:11px;margin-top:5px}.actions{display:flex;gap:6px;margin-top:11px}.action{font-size:11px;font-weight:800;text-decoration:none}.save{color:#8ee8c9;border-color:rgba(0,233,158,.2)}.empty{padding:50px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.hidden{display:none!important}.history{display:grid;gap:8px}.h{display:grid;grid-template-columns:80px 1fr auto;gap:11px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025)}.himg{height:58px;border-radius:10px;overflow:hidden;background:#07100d}.himg img{width:100%;height:100%;object-fit:cover}.hinfo{min-width:0}.hinfo b,.hinfo small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hinfo small{color:var(--muted);margin-top:4px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101b17;border:1px solid var(--line);padding:12px 15px;border-radius:13px;display:none;z-index:100;max-width:90%}.toast.show{display:block}@media(max-width:760px){.row{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.nav .desktop{display:none}}@media(max-width:540px){.wrap{width:min(100% - 16px,540px)}.cards{grid-template-columns:1fr}.hero{padding-top:45px}h1{letter-spacing:-3px}.box{padding:13px}.h{grid-template-columns:65px 1fr}.h .actions{grid-column:2}}
</style></head><body><div class="wrap"><header><div class="brand"><div class="logo">V</div><div>VEXDOU<span class="sub">MEDIA DOWNLOADER</span></div></div><div class="nav"><button data-view="home" class="active">Home</button><button data-view="downloads" class="desktop">Downloads</button><button data-view="history">History</button><button data-view="favorites">♡ Favorites</button></div></header>
<main><section id="homeView"><div class="hero"><div class="badge">● SIMPLE · FAST · PRIVATE</div><h1>Download <span>Anything.</span><br>Keep It.</h1><p class="lead">Fast public-media downloads from YouTube, TikTok, Instagram, Facebook, Pinterest and X/Twitter.</p></div><section class="box"><div class="row"><input id="url" class="input" type="url" placeholder="Paste a video link here…" autocomplete="off"><select id="kind" class="select"><option value="video">🎬 Video</option><option value="audio">🎵 MP3 Audio</option></select><button id="downloadBtn" class="primary">⬇ Download</button></div><div class="chips"><button class="chip" data-example="https://youtube.com/">YouTube</button><button class="chip" data-example="https://tiktok.com/">TikTok</button><button class="chip" data-example="https://instagram.com/">Instagram</button><button class="chip" data-example="https://facebook.com/">Facebook</button><button class="chip" data-example="https://pinterest.com/">Pinterest</button><button class="chip" data-example="https://x.com/">X / Twitter</button></div><div id="status" class="status"><b id="statusText">Preparing…</b><div class="progress"><div id="bar" class="bar"></div></div></div></section></section>
<section id="downloadsView" class="section hidden"><div class="head"><div><div class="muted">YOUR MEDIA</div><h2>Downloads</h2></div></div><div id="downloads" class="cards"></div></section>
<section id="historyView" class="section hidden"><div class="head"><div><div class="muted">YOUR ACTIVITY</div><h2>History</h2></div><button id="clear" class="action">Clear</button></div><div id="history" class="history"></div></section>
<section id="favoritesView" class="section hidden"><div class="head"><div><div class="muted">SAVED MEDIA</div><h2>Favorites</h2></div></div><div id="favorites" class="cards"></div></section></main></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={jobs:JSON.parse(localStorage.getItem('vexdou_jobs')||'[]'),favs:new Set(JSON.parse(localStorage.getItem('vexdou_favs')||'[]'))};
const save=()=>{localStorage.setItem('vexdou_jobs',JSON.stringify(state.jobs.slice(0,50)));localStorage.setItem('vexdou_favs',JSON.stringify([...state.favs]))};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(x){const t=$('#toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),3000)}
function show(name){['homeView','downloadsView','historyView','favoritesView'].forEach(x=>$('#'+x).classList.add('hidden'));$('#'+(name==='home'?'homeView':name+'View')).classList.remove('hidden');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='downloads')renderDownloads();if(name==='history')loadHistory();if(name==='favorites')renderFavorites();window.scrollTo({top:0,behavior:'smooth'})}
$$('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));$$('.chip').forEach(b=>b.onclick=()=>{$('#url').value=b.dataset.example;$('#url').focus()});
function card(x){let url=x.download_url||('/api/file/'+encodeURIComponent(x.job_id));return `<article class="card"><div class="thumb">${x.thumbnail?`<img src="${esc(x.thumbnail)}" loading="lazy">`:'<span style="font-size:45px">▶</span>'}</div><div class="body"><div class="title">${esc(x.title||'Media')}</div><div class="meta">${esc(x.platform)} · ${esc(x.kind)} · ${esc(x.status)}</div><div class="actions"><a class="action save" href="${esc(url)}" target="_blank" rel="noopener">⬇ Save</a><button class="action fav" data-fav="${esc(x.job_id)}">${state.favs.has(x.job_id)?'♥':'♡'}</button></div></div></article>`}
function renderDownloads(){let a=state.jobs.filter(x=>x.status==='completed');$('#downloads').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Your completed downloads will appear here.</div>';bindFav()}
function renderFavorites(){let a=state.jobs.filter(x=>state.favs.has(x.job_id)&&x.status==='completed');$('#favorites').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No favorites yet.</div>';bindFav()}
function bindFav(){$$('[data-fav]').forEach(b=>b.onclick=()=>{let id=b.dataset.fav;state.favs.has(id)?state.favs.delete(id):state.favs.add(id);save();renderDownloads();renderFavorites()})}
async function loadHistory(){try{let r=await fetch('/api/history',{cache:'no-store'});let d=await r.json();state.jobs=d.items||[];save();$('#history').innerHTML=state.jobs.length?state.jobs.map(x=>`<div class="h"><div class="himg">${x.thumbnail?`<img src="${esc(x.thumbnail)}">`:'▶'}</div><div class="hinfo"><b>${esc(x.title||'Media')}</b><small>${esc(x.platform)} · ${esc(x.status)}${x.error?' · '+esc(x.error):''}</small></div><div class="actions">${x.status==='completed'?`<a class="action save" href="${esc(x.download_url||('/api/file/'+x.job_id))}" target="_blank">Save</a>`:''}</div></div>`).join(''):'<div class="empty">No downloads yet.</div>'}catch(e){toast('Could not load history')}}
async function start(){let url=$('#url').value.trim(),kind=$('#kind').value;if(!url)return toast('Paste a link first');let btn=$('#downloadBtn');btn.disabled=true;btn.textContent='Starting…';$('#status').classList.add('show');$('#statusText').textContent='Adding to download queue…';$('#bar').style.width='10%';try{let r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,kind})});let d=await r.json();if(!r.ok)throw Error(d.detail||d.error||'Could not start download');state.jobs.unshift({job_id:d.job_id,status:'queued',kind,platform:d.platform,title:'Preparing…',url});save();poll(d.job_id)}catch(e){toast(e.message);$('#statusText').textContent='Download could not start';$('#bar').style.width='0%'}finally{btn.disabled=false;btn.textContent='⬇ Download'}}
async function poll(job){let started=Date.now();for(;;){await new Promise(r=>setTimeout(r,900));try{let r=await fetch('/api/download/'+encodeURIComponent(job),{cache:'no-store'});if(!r.ok)throw Error('Status unavailable');let x=await r.json();let i=state.jobs.findIndex(a=>a.job_id===job);if(i>=0)state.jobs[i]=x;else state.jobs.unshift(x);save();if(x.status==='queued'){ $('#statusText').textContent='Download queued…';$('#bar').style.width='15%'}else if(x.status==='downloading'){ $('#statusText').textContent='Downloading '+x.platform+'…';$('#bar').style.width='55%'}else if(x.status==='completed'){ $('#statusText').textContent='✓ Download ready';$('#bar').style.width='100%';toast('Download completed');renderDownloads();setTimeout(()=>show('downloads'),400);return}else if(x.status==='failed'){throw Error(x.error||'Download failed')}if(Date.now()-started>10*60*1000)throw Error('Download timed out')}catch(e){$('#statusText').textContent='❌ '+e.message;$('#bar').style.width='0%';toast(e.message);return}}}
$('#downloadBtn').onclick=start;$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')start()});$('#clear').onclick=async()=>{if(!confirm('Clear your download history?'))return;await fetch('/api/history',{method:'DELETE'});state.jobs=[];state.favs.clear();save();loadHistory()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});loadHistory();
</script></body></html>
