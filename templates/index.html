<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>QuickDL</title>
<link rel="stylesheet" href="/static/styles.css">
</head><body>
<main class="wrap">
  <header><div class="logo">Quick<span>DL</span></div><div class="pill">YouTube • Instagram</div></header>
  <section class="hero">
    <h1>Download media quickly.</h1>
    <p>Paste a public media URL. YouTube and Instagram are supported through yt-dlp.</p>
    <div class="card">
      <input id="url" type="url" placeholder="Paste YouTube or Instagram URL…" autocomplete="off">
      <div class="actions">
        <select id="kind"><option value="video">Video</option><option value="audio">MP3 / Audio</option></select>
        <button id="go">Download</button>
      </div>
      <div id="msg" class="msg"></div>
      <div id="result" class="result hidden"></div>
    </div>
  </section>
  <section class="history">
    <div class="section-head"><h2>Recent downloads</h2><button id="refresh">Refresh</button></div>
    <div id="historyList" class="list"></div>
  </section>
</main>
<script src="/static/app.js"></script>
</body></html>
