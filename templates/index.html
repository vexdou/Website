
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickDL</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<header><div class="brand">Quick<span>DL</span></div><nav><button class="nav active" data-view="home">Home</button><button class="nav" data-view="history">History</button><button class="nav" data-view="favorites">Favorites</button></nav></header>
<main>
<section id="homeView" class="view"><div id="announcement" class="notice hidden"></div><div class="hero"><div class="eyebrow">FAST • PUBLIC MEDIA DOWNLOADER</div><h1>Download videos from your favorite platforms.</h1><p>Paste a public link. QuickDL automatically chooses the best available extractor.</p>
<div class="download-box"><input id="url" placeholder="Paste YouTube, Instagram, TikTok, Facebook, Pinterest, X, Snapchat or other link"><button id="pasteBtn">Paste</button><select id="kind"><option value="video">Video</option><option value="audio">Audio</option></select><button id="downloadBtn" class="primary">↓ Download</button></div>
<div class="platforms"><span>▶ YouTube</span><span>♪ TikTok</span><span>◎ Instagram</span><span>f Facebook</span><span>◈ Pinterest</span><span>𝕏 X</span><span>👻 Snapchat</span><span>＋ Other web</span></div></div>
<div id="status" class="card hidden"><b id="statusText">Preparing…</b><p id="statusSub"></p><div class="progress"><i id="bar"></i></div></div></section>
<section id="historyView" class="view hidden"><div class="sectionHead"><h2>History</h2><button id="clear">Clear</button></div><div id="history"></div></section>
<section id="favoritesView" class="view hidden"><div class="sectionHead"><h2>Favorites</h2></div><div id="favorites"></div></section>
</main>
<div id="player" class="modal hidden"><div class="modalBox"><button id="closePlayer">×</button><h2 id="playerTitle">Media</h2><video id="video" controls playsinline></video><audio id="audio" controls></audio><a id="saveBtn" class="primary saveBtn">Save file</a></div></div>
<div id="toast"></div><script src="/static/app.js"></script></body></html>
