<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram Admin — QuickDL</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#eef3f8;font-family:system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:35px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#111720;border:1px solid #202a35;border-radius:16px;padding:18px}.num{font-size:30px;font-weight:800}.muted{color:#8f9ba8}textarea{width:100%;min-height:150px;background:#0b1016;color:#fff;border:1px solid #2a3542;border-radius:12px;padding:14px;font:inherit}button{border:0;border-radius:10px;padding:11px 16px;background:#2ea6ff;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.table{margin-top:18px;overflow:auto}.row{display:grid;grid-template-columns:110px 1fr 120px 160px;gap:10px;padding:10px;border-bottom:1px solid #202a35}.ok{color:#65e6a0}.bad{color:#ff8585}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Telegram Admin</h1><p class="muted">Only users who explicitly opted in and started the QuickDL bot can receive broadcasts.</p><div class="grid"><div class="card"><div class="muted">Telegram users</div><div id="total" class="num">—</div></div><div class="card"><div class="muted">Opted in</div><div id="opted" class="num">—</div></div><div class="card"><div class="muted">Admin</div><div class="num">Ready</div></div></div><div class="card" style="margin-top:14px"><h2>Broadcast</h2><textarea id="text" placeholder="Write your announcement or link..."></textarea><br><button id="send">Send to all opted-in users</button><div id="result" class="muted"></div></div><div class="card table"><h2>Users</h2><div class="row"><b>Telegram ID</b><b>Username / name</b><b>Consent</b><b>Last broadcast</b></div><div id="users"></div></div></div><script>
async function load(){const r=await fetch('/api/telegram/admin/stats');if(!r.ok){document.body.innerHTML='<div class="wrap"><h1>Admin authentication required</h1></div>';return}const d=await r.json();document.getElementById('total').textContent=d.total_users;document.getElementById('opted').textContent=d.opted_in;document.getElementById('users').innerHTML=d.users.map(u=>`<div class="row"><span>${u.id}</span><span>${u.username?'@'+u.username:u.name||'—'}</span><span class="${u.opted_in?'ok':'bad'}">${u.opted_in?'Allowed':'No'}</span><span>${u.last_broadcast_at?new Date(u.last_broadcast_at).toLocaleString():'—'}</span></div>`).join('')}
document.getElementById('send').onclick=async()=>{const text=document.getElementById('text').value.trim();if(!text)return;document.getElementById('result').textContent='Sending...';const r=await fetch('/api/telegram/admin/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const d=await r.json();document.getElementById('result').textContent=d.ok?`Sent: ${d.sent} · Failed: ${d.failed}`:(d.detail||'Broadcast failed');load()};load();
</script></body></html>
