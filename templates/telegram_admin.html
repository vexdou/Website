<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram Admin — QuickDL</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#eef3f8;font-family:system-ui,sans-serif}.wrap{width:min(1250px,calc(100% - 20px));margin:20px auto}.grid{display:grid;grid-template-columns:320px 1fr;gap:12px}.card{background:#111720;border:1px solid #202a35;border-radius:15px;padding:15px}.users{max-height:78vh;overflow:auto}.user{padding:12px;border-bottom:1px solid #202a35;cursor:pointer}.user:hover,.user.active{background:#19212b}.muted{color:#8d99a6}.ok{color:#61e6a0}.bad{color:#ff8585}.chats{max-height:28vh;overflow:auto}.chat{padding:10px;border-bottom:1px solid #202a35;cursor:pointer}.messages{height:43vh;overflow:auto;background:#0b1016;border-radius:10px;padding:10px}.msg{max-width:75%;background:#192431;border-radius:11px;padding:8px 11px;margin:6px 0}.msg.out{margin-left:auto;background:#164c6c}textarea{width:100%;min-height:90px;background:#0b1016;color:#fff;border:1px solid #2a3542;border-radius:10px;padding:12px;font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:#2ea6ff;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.danger{background:#e85d6a}@media(max-width:800px){.grid{grid-template-columns:1fr}.users{max-height:35vh}.messages{height:35vh}}</style></head><body><div class="wrap"><h1>Telegram Admin</h1><p class="muted">Chat access is available only for users who explicitly granted Admin chat access. Users can revoke it at any time.</p><div class="grid"><div class="card"><h3>Telegram users</h3><div id="users" class="users">Loading...</div></div><div><div class="card"><h3 id="selectedUser">Select a user</h3><div id="access" class="muted">—</div></div><div class="card" style="margin-top:12px"><h3>Chats</h3><div id="chats" class="chats"></div></div><div class="card" style="margin-top:12px"><h3 id="chatTitle">Messages</h3><div id="messages" class="messages"></div><textarea id="text" placeholder="Send a message to the selected chat"></textarea><button id="send">Send through this user's Telegram account</button><div id="result" class="muted"></div></div><div class="card" style="margin-top:12px"><h3>QuickDL Bot Broadcast</h3><p class="muted">This is for users who opted in to QuickDL bot messages.</p><textarea id="broadcast" placeholder="Announcement..."></textarea><button id="broadcastBtn">Send to opted-in users</button><div id="broadcastResult" class="muted"></div></div></div></div></div><script>
let user=null,dialog=null;const $=x=>document.getElementById(x);async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.detail||'Request failed');return j}
async function loadUsers(){const j=await api('/api/telegram/admin/users');$('users').innerHTML=j.items.map(x=>`<div class="user" data-v="${x.visitor_id}"><b>${esc(x.name||x.username||x.telegram_id||'User')}</b><div class="muted">${x.username?'@'+esc(x.username)+' · ':''}${x.telegram_id||''}</div><div class="${x.admin_chat_access?'ok':'bad'}">${x.admin_chat_access?'Admin chat access: ON':'Admin chat access: OFF'}</div></div>`).join('');document.querySelectorAll('.user').forEach(x=>x.onclick=()=>selectUser(x.dataset.v));}
async function selectUser(v){user=v;dialog=null;$('selectedUser').textContent='User: '+v;const all=await api('/api/telegram/admin/users');const x=all.items.find(a=>a.visitor_id===v);$('access').textContent=x&&x.admin_chat_access?'Consent granted — chats can be viewed.':'Consent not granted — admin cannot view chats.';$('chats').innerHTML='';$('messages').innerHTML='';$('chatTitle').textContent='Messages';if(x&&x.admin_chat_access)loadChats();}
async function loadChats(){try{const j=await api('/api/telegram/admin/'+encodeURIComponent(user)+'/chats');$('chats').innerHTML=j.items.map(c=>`<div class="chat" data-id="${c.id}"><b>${esc(c.name)}</b><div class="muted">${c.username?'@'+esc(c.username):''}</div></div>`).join('');document.querySelectorAll('.chat').forEach(x=>x.onclick=()=>openChat(Number(x.dataset.id),x.querySelector('b').textContent))}catch(e){$('access').textContent=e.message}}
async function openChat(id,name){dialog=id;$('chatTitle').textContent=name;const j=await api('/api/telegram/admin/'+encodeURIComponent(user)+'/chats/'+id+'/messages');$('messages').innerHTML=j.items.reverse().map(m=>`<div class="msg ${m.out?'out':''}">${esc(m.text||'[media]')}<div class="muted">${m.date?new Date(m.date).toLocaleString():''}</div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}
$('send').onclick=async()=>{if(!user||dialog===null)return;const text=$('text').value.trim();if(!text)return;try{await api('/api/telegram/admin/'+encodeURIComponent(user)+'/chats/'+dialog+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor_id:user,dialog_id:dialog,text})});$('text').value='';openChat(dialog,$('chatTitle').textContent);$('result').textContent='Sent.'}catch(e){$('result').textContent=e.message}};
$('broadcastBtn').onclick=async()=>{const text=$('broadcast').value.trim();if(!text)return;try{const j=await api('/api/telegram/admin/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});$('broadcastResult').textContent=`Sent ${j.sent}; failed ${j.failed}.`}catch(e){$('broadcastResult').textContent=e.message}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}loadUsers();
</script></body></html>
